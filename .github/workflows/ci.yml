name: CI

on:
  push:
    branches: ["banking-core"]
  pull_request:
    branches: ["banking-core"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy
        pip install -r requirements.txt
    - name: Run Ruff
      run: ruff check .
    - name: Run Mypy
      run: mypy src

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: banking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d banking_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov httpx pytest-asyncio
        pip install -r requirements.txt
    - name: Run Tests
      env:
        DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/banking_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: testsecret
        PYTHONPATH: .
      run: |
        python -m pytest --cov=src --cov-fail-under=80

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build -t banking-app .
