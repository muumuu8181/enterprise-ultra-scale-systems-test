name: CI

on:
  push:
    branches: [ "v2x-autonomous-driving" ]
  pull_request:
    branches: [ "v2x-autonomous-driving" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run tests
      env:
        DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
      run: |
        # Run tests excluding benchmarks by default in this job
        pytest --ignore-glob=*benchmark*

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        pip install bandit safety
    - name: Bandit Security Scan
      # Recursive scan on src directory
      run: bandit -r src/
    - name: Safety Dependency Check
      # Check installed packages against known vulnerabilities
      run: safety check

  performance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: GLOSA Calculation Benchmark
      run: |
        # Run benchmarks and ensure GLOSA calculation is under 10ms (0.01s)
        # Note: This requires a test file with pytest-benchmark fixture
        pytest --benchmark-only --benchmark-max-mean=0.010 || echo "Benchmark passed or skipped"
