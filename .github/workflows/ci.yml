name: CI

on:
  push:
    branches: [ "smart-city-platform" ]
  pull_request:
    branches: [ "smart-city-platform" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start services (Docker Compose)
      run: |
        docker compose up -d db redis mosquitto timescaledb
        # Wait for services to be ready
        sleep 15

    - name: Run Pytest
      env:
        DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/smartcity
        TIMESCALE_URL: postgresql+asyncpg://user:password@localhost:5433/timescale
        REDIS_URL: redis://localhost:6379/0
        MQTT_BROKER: localhost
        MQTT_PORT: 1883
      run: |
        pytest

    - name: MQTT Integration Test
      env:
        MQTT_BROKER: localhost
        MQTT_PORT: 1883
      run: |
        python -c "
        import asyncio
        import asyncio_mqtt as aiomqtt

        async def main():
            try:
                async with aiomqtt.Client('localhost') as client:
                    print('Successfully connected to MQTT broker')
            except Exception as e:
                print(f'Failed to connect: {e}')
                exit(1)

        asyncio.run(main())
        "
