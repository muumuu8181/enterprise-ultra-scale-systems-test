# FastAPI App Deployment + HPA
# 概要: スマートシティプラットフォームのAPIサーバー
# 設定: レプリカ数3-30のオートスケーリング, 環境変数設定

apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-city-app
  labels:
    app: smart-city-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smart-city-app
  template:
    metadata:
      labels:
        app: smart-city-app
    spec:
      containers:
      - name: app
        image: smart-city-platform:latest # 実際にはビルドしたイメージを指定
        ports:
        - containerPort: 8000
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: smart-city-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smart-city-secrets
              key: postgres-password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: smart-city-secrets
              key: postgres-db
        - name: DATABASE_URL
          value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@timescaledb:5432/$(POSTGRES_DB)"
        - name: MQTT_BROKER_HOST
          value: "mqtt-service"
        - name: MQTT_BROKER_PORT
          value: "1883"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smart-city-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smart-city-app
  minReplicas: 3
  maxReplicas: 30
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: v1
kind: Service
metadata:
  name: smart-city-app
spec:
  type: ClusterIP
  selector:
    app: smart-city-app
  ports:
  - port: 80
    targetPort: 8000
    name: http
