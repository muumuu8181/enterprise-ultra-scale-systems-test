# Network Policy (センサーからのingress制限)
# 概要: MQTTブローカーへの外部アクセス制御
# 設定: センサー通信ポート(1883, 9001)のみを許可し、他のポートへのアクセスを遮断
#       本番環境では ipBlock: cidr を特定の信頼できるIP範囲に制限することを推奨

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sensor-ingress-policy
spec:
  podSelector:
    matchLabels:
      app: mqtt-broker
  policyTypes:
  - Ingress
  ingress:
  # 外部センサーからの接続許可
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 1883
    - protocol: TCP
      port: 9001
  # 内部アプリケーションからの接続許可
  - from:
    - podSelector:
        matchLabels:
          app: smart-city-app
    ports:
    - protocol: TCP
      port: 1883
