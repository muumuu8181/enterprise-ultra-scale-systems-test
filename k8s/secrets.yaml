# Secrets
# 概要: 機密情報(データベースパスワード等)の管理
# 注意: 本番環境では外部のSecret管理システム(Vault, AWS Secrets Manager等)やSealedSecretsの使用を推奨

apiVersion: v1
kind: Secret
metadata:
  name: smart-city-secrets
type: Opaque
stringData:
  postgres-password: "password"
  postgres-user: "postgres"
  postgres-db: "smart_city"
  grafana-admin-password: "admin"

  # Grafana Datasource Configuration (Sensitive due to password)
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: TimescaleDB
      type: postgres
      url: timescaledb:5432
      database: smart_city
      user: postgres
      secureJsonData:
        password: "password"
      jsonData:
        sslmode: "disable"
        timescaledb: true
