version: '3.8'

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scf_password}
      POSTGRES_DB: ${POSTGRES_DB:-scf_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"

  worker:
    build: .
    command: celery -A src.worker worker --loglevel=info
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgresql://scf_user:scf_password@postgres/scf_db}
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
