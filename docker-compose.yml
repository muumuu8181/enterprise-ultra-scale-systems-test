version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: water_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  influxdb:
    image: influxdb:2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password123
      DOCKER_INFLUXDB_INIT_ORG: water_org
      DOCKER_INFLUXDB_INIT_BUCKET: water_bucket
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2

  worker:
    build: .
    command: celery -A src.worker.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/water_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
      - influxdb

volumes:
  postgres_data:
  influxdb_data:
